<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Join AI Society | University of Portsmouth</title>
  <link rel="icon" href="../brand/logos/logo-stacked.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@700;800&family=JetBrains+Mono:wght@500&display=swap">
  <style>
    :root {
      color-scheme: light;
      --deep: #06283f;
      --navy: #073b5c;
      --slate: #668998;
      --cream: #f7f5f0;
      --display: "Inter Tight", Inter, system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
      font-family: Inter, system-ui, sans-serif;
      color: var(--cream);
      background: var(--deep);
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      min-height: 100svh;
      margin: 0;
      background:
        radial-gradient(ellipse at 110% 106%, var(--cream) 18%, #e2e4dd 31%, transparent 61%),
        radial-gradient(ellipse at 87% -75%, var(--slate), transparent 67%),
        linear-gradient(128deg, var(--deep) 18%, var(--navy) 65%, var(--slate));
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      opacity: .3;
      pointer-events: none;
      background: url("data:image/svg+xml,%3Csvg width='192' height='192' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.62' numOctaves='3' seed='23' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' opacity='.5' filter='url(%23g)'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }
    .shell { position: relative; width: min(calc(100% - 112px), 1280px); margin-inline: auto; }
    header { display: flex; align-items: center; gap: 18px; min-height: 88px; border-bottom: 1.5px solid #f7f5f047; }
    .logo { width: 65px; height: auto; }
    .university { padding-left: 18px; border-left: 1.5px solid #f7f5f068; font-size: .95rem; font-weight: 600; }
    main {
      display: grid;
      grid-template-columns: 1.15fr minmax(0, 1fr);
      align-items: center;
      gap: clamp(40px, 7vw, 112px);
      min-height: calc(100svh - 88px);
      padding-block: clamp(36px, 6vh, 84px);
    }
    .join { min-width: 0; }
    h1, h2 { margin: 0; font-family: var(--display); font-weight: 800; letter-spacing: -.03em; }
    h1 { font-size: clamp(2.875rem, 5.7vw, 6.5rem); line-height: .98; }
    .scan { margin: 16px 0 22px; font-size: clamp(1.125rem, 1.65vw, 1.5rem); line-height: 1.45; }
    .qr {
      display: block;
      width: min(100%, clamp(290px, 52vh, 470px));
      height: auto;
      aspect-ratio: 1;
      background: #fff;
      border-radius: 12px;
      image-rendering: pixelated;
    }
    main:has(.event[hidden]) { grid-template-columns: minmax(0, 1fr); }
    main:has(.event[hidden]) .join { max-width: 52rem; }

    .event {
      overflow: hidden;
      border: 1.5px solid #fff9;
      border-radius: 24px;
      background: #e6e9e6;
      color: var(--deep);
      box-shadow: 0 20px 64px #06283f27;
    }
    @supports (backdrop-filter: blur(16px)) {
      .event { background: #f7f5f0cc; backdrop-filter: blur(16px); }
    }
    .event-art {
      height: clamp(116px, 25vh, 216px);
      background: var(--navy);
    }
    .event-art img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 48%;
    }
    .event-details { padding: clamp(22px, 3vw, 40px); }
    .event-date { margin: 0 0 16px; font: 500 .85rem/1.45 var(--mono); letter-spacing: .025em; text-transform: uppercase; }
    h2 { max-width: 14ch; font-size: clamp(2.25rem, 3.5vw, 3.8rem); line-height: 1.01; }
    .edition { margin: 8px 0 20px; font-size: clamp(1.1rem, 1.55vw, 1.4rem); font-weight: 600; }
    .event-info { border-top: 1.5px solid #06283f42; padding-top: 16px; }
    .event-info p { margin: 0; font-size: clamp(.95rem, 1.3vw, 1.15rem); line-height: 1.5; }
    .event-info p + p { margin-top: 3px; }

    @media (max-width: 820px) {
      body {
        background:
          radial-gradient(ellipse at 100% 115%, var(--cream) 9%, #e2e4dd 27%, transparent 66%),
          linear-gradient(148deg, var(--deep) 19%, var(--navy) 63%, var(--slate));
      }
      .shell { width: min(calc(100% - 40px), 540px); }
      header { min-height: 72px; gap: 12px; }
      .logo { width: 52px; }
      .university { padding-left: 12px; font-size: .82rem; }
      main { min-height: auto; grid-template-columns: minmax(0, 1fr); gap: 40px; }
      .qr { width: min(100%, 390px); }
    }
    @media (prefers-contrast: more) {
      body { background: var(--deep); }
      .event { background: var(--cream); }
    }
  </style>
  <script src="projector.js" defer></script>
</head>
