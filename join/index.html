<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Join AI Society | University of Portsmouth</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@700;800&family=JetBrains+Mono:wght@500&display=swap">
  <style>
    :root {
      --deep: #06283f;
      --navy: #073b5c;
      --slate: #668998;
      --cream: #f7f5f0;
      --display: "Inter Tight", Inter, system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
      --grain: url("data:image/svg+xml,%3Csvg width='192' height='192' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.62' numOctaves='3' seed='23' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' opacity='.5' filter='url(%23g)'/%3E%3C/svg%3E");
      font-family: Inter, system-ui, sans-serif;
      color: var(--cream);
      background: var(--deep);
    }
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      min-height: 100svh;
      margin: 0;
      background:
        radial-gradient(ellipse 22% 36% at 63% 104%, #e8e7df69 0%, #66899860 50%, transparent 100%),
        radial-gradient(ellipse 52% 56% at 58% -8%, #6689988c 0%, transparent 100%),
        linear-gradient(124deg, var(--deep) 22%, var(--navy) 72%, #245570);
    }
    body::before, .event::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--grain);
      opacity: .55;
      mix-blend-mode: soft-light;
      pointer-events: none;
    }
    body::before { position: fixed; z-index: 1; }
    .ambient {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .ambient::before {
      content: "";
      position: absolute;
      width: clamp(380px, 66vw, 1080px);
      aspect-ratio: 1.18;
      left: 59%;
      top: 35%;
      background: radial-gradient(ellipse, #f7f5f0a8 0%, #aebbc0a8 29%, #66899869 49%, transparent 71%);
      animation: drift 32s ease-in-out infinite;
    }
    @keyframes drift {
      0%, 100% { transform: translate(1%, 9%) scale(1); }
      33% { transform: translate(-9%, -15%) scale(1.09); }
      66% { transform: translate(9%, -29%) scale(.92); }
    }
    body[data-motion-paused] .ambient::before { animation-play-state: paused; }
    .presenter-controls {
      position: fixed;
      z-index: 3;
      inset: auto 16px 14px auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .presenter-controls button {
      border: 1px solid #f7f5f052;
      background: var(--deep);
      color: var(--cream);
      cursor: pointer;
    }
    .motion-toggle {
      --dismiss-delay: 5s;
      position: relative;
      overflow: hidden;
      border-radius: 999px;
      padding: 5px 9px 7px;
      font: 500 .72rem Inter, system-ui, sans-serif;
      animation: dismiss-motion-toggle .4s ease var(--dismiss-delay) forwards;
    }
    .motion-toggle::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 2px;
      background: currentColor;
      transform-origin: left;
      animation: motion-countdown var(--dismiss-delay) linear forwards;
    }
    @keyframes motion-countdown { to { transform: scaleX(0); } }
    .motion-toggle:is(:hover, :focus-visible)::after,
    body[data-motion-paused] .motion-toggle::after { animation: none; }
    body[data-motion-paused] .motion-toggle::after { opacity: 0; }
    .fullscreen-toggle {
      display: grid;
      place-items: center;
      width: 40px;
      height: 36px;
      padding: 0;
      border-radius: 999px;
    }
    .fullscreen-toggle svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    @media (hover: hover) and (pointer: fine) {
      html:fullscreen .fullscreen-toggle { display: none; }
    }
    html:fullscreen[data-cursor-idle],
    html:fullscreen[data-cursor-idle] * { cursor: none; }
    @keyframes dismiss-motion-toggle { to { opacity: 0; } }
    .motion-toggle:is(:hover, :focus-visible),
    body[data-motion-paused] .motion-toggle { animation: none; }
    .presenter-controls button:focus-visible { outline: 2px solid var(--cream); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) {
      .ambient::before { animation: none; }
      .motion-toggle { display: none; }
    }
    .shell {
      --header-top: clamp(24px, 4.4vh, 48px);
      --lockup-width: clamp(140px, 21vw, 270px);
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100svh;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: clamp(12px, 2vw, 28px);
      padding: var(--header-top) clamp(20px, 4vw, 72px) 8px;
    }
    .logo { display: block; width: var(--lockup-width); height: auto; }
    .handle {
      font: 600 clamp(1rem, 1.7vw, 1.625rem)/1.3 Inter, system-ui, sans-serif;
      color: var(--cream);
      white-space: nowrap;
    }
    main {
      --qr-size: min(59vh, 470px);
      display: grid;
      grid-template-columns: minmax(0, var(--qr-size)) minmax(0, var(--poster-size, 418px));
      align-items: center;
      justify-content: center;
      gap: clamp(36px, 5vw, 72px);
      width: min(calc(100% - 96px), 1240px);
      margin-inline: auto;
      padding-block: clamp(16px, 2.6vh, 32px) clamp(18px, 3vh, 40px);
    }
    .join { min-width: 0; width: min(100%, var(--qr-size)); }
    h1, h2 { margin: 0; font-family: var(--display); }
    h1 { font-size: clamp(1.75rem, 3vw, 2.625rem); font-weight: 700; letter-spacing: -.025em; line-height: 1.14; }
    .benefits { margin: 8px 0 16px; font-size: clamp(.96rem, 1.3vw, 1.16rem); line-height: 1.45; color: #e5eef0; }
    .scan { margin: 0 0 14px; font-size: clamp(1rem, 1.37vw, 1.2rem); font-weight: 600; line-height: 1.4; }
    .qr {
      display: block;
      width: 100%;
      height: auto;
      background: #fff;
      border-radius: 12px;
      image-rendering: pixelated;
      box-shadow: 0 12px 32px #06283f24;
    }
    main:has(.event[hidden]) { grid-template-columns: minmax(0, var(--qr-size)); }

    @supports (grid-template-rows: subgrid) {
      @media (min-width: 821px) {
        main {
          grid-template-rows: auto auto;
          align-content: center;
          align-items: start;
          row-gap: 0;
        }
        .join {
          grid-column: 1;
          grid-row: 1 / 3;
          display: grid;
          grid-template-rows: subgrid;
        }
        .event { grid-column: 2; grid-row: 2; }
      }
    }

    .event {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      width: min(100%, var(--poster-size, 418px));
      min-height: clamp(320px, 49vh, 382px);
      padding: clamp(24px, 2.6vw, 38px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 30px;
      border: 1px solid #f7f5f06e;
      border-radius: 24px;
      color: var(--cream);
      background:
        radial-gradient(ellipse at 87% 3%, #285b73 0%, transparent 70%),
        linear-gradient(146deg, var(--navy), var(--deep) 74%);
      box-shadow: 0 2px 5px #06283f28, 0 22px 38px -16px #06283f85, 0 34px 78px -26px #06283f70;
    }
    .event::before { z-index: -1; }
    .event-heading, .event-info { position: relative; z-index: 1; }
    .event-name {
      margin: 0 0 16px;
      font: 500 clamp(.74rem, 1.1vw, .88rem)/1.45 var(--mono);
      letter-spacing: .09em;
      text-transform: uppercase;
      color: #d4e0e2;
    }
    h2 {
      font-size: clamp(1.95rem, 3.05vw, 2.85rem);
      font-weight: 800;
      line-height: .96;
      letter-spacing: -.04em;
    }
    .edition {
      margin: 12px 0 0;
      color: #ffcf51;
      font-family: var(--display);
      font-weight: 700;
      font-size: clamp(1.1rem, 1.6vw, 1.5rem);
      letter-spacing: -.025em;
    }
    .event-info { max-width: 57%; }
    .event-info p { margin: 0; font-size: clamp(.91rem, 1.22vw, 1.125rem); line-height: 1.45; }
    .event-info .venue { margin-bottom: 12px; font-weight: 600; }
    .event-info .pill {
      display: inline-block;
      padding: 5px 11px;
      border: 1px solid #d4e0e29e;
      border-radius: 999px;
      font-size: clamp(.72rem, 1vw, .89rem);
    }
    .game-art {
      position: absolute;
      z-index: 0;
      width: 49%;
      right: -1.5%;
      bottom: -5%;
      filter: drop-shadow(-8px 10px 21px #041a30b3);
    }
    .game-art img {
      display: block;
      width: 100%;
      height: auto;
      clip-path: polygon(12% 5%, 14% 2%, 18% 1%, 88% 8%, 91% 10%, 92% 13%, 82% 100%, 2% 100%);
    }
    @media (min-width: 821px) {
      main {
        /* Scale the 1366 × 768 composition, reserving room for the header. */
        --available-height: calc(100svh - var(--header-top) - var(--lockup-width) * .3 - 8px);
        --max-qr-size: 640px;
        --stage-unit: clamp(.4px, min(calc(100vw / 1366), calc(var(--available-height) / 638)), calc(var(--max-qr-size) / 453));
        --qr-size: calc(453 * var(--stage-unit));
        --poster-size: calc(418 * var(--stage-unit));
        column-gap: calc(68 * var(--stage-unit));
        width: calc(100% - 80px);
        padding-block: calc(20 * var(--stage-unit)) calc(24 * var(--stage-unit));
      }
      h1 { font-size: calc(41 * var(--stage-unit)); }
      .benefits {
        margin: calc(8 * var(--stage-unit)) 0 calc(16 * var(--stage-unit));
        font-size: calc(18 * var(--stage-unit));
      }
      .scan { margin-bottom: calc(14 * var(--stage-unit)); font-size: calc(19 * var(--stage-unit)); }
      .qr { border-radius: calc(12 * var(--stage-unit)); }
      .event {
        min-height: calc(376 * var(--stage-unit));
        padding: calc(35 * var(--stage-unit));
        gap: calc(30 * var(--stage-unit));
        border-radius: calc(24 * var(--stage-unit));
      }
      .event-name { margin-bottom: calc(16 * var(--stage-unit)); font-size: calc(14 * var(--stage-unit)); }
      h2 { font-size: calc(42 * var(--stage-unit)); }
      .edition { margin-top: calc(12 * var(--stage-unit)); font-size: calc(22 * var(--stage-unit)); }
      .event-info p { font-size: calc(17 * var(--stage-unit)); }
      .event-info .venue { margin-bottom: calc(12 * var(--stage-unit)); }
      .event-info .pill {
        padding: calc(5 * var(--stage-unit)) calc(11 * var(--stage-unit));
        font-size: calc(14 * var(--stage-unit));
      }
    }
    @media (max-width: 820px) {
      .shell { grid-template-rows: auto auto; align-content: start; }
      header { padding-top: 24px; }
      .ambient::before { left: 48%; top: 58%; }
      main { width: min(calc(100% - 40px), 600px); grid-template-columns: minmax(0, 1fr); gap: 32px; }
      .join { width: min(100%, 360px); }
      .event { min-height: clamp(310px, 84vw, 370px); gap: 28px; }
      .game-art { width: 49%; right: -6%; bottom: -4%; }
    }
    @media (max-width: 390px) {
      h2 { font-size: clamp(1.8rem, 8vw, 2.2rem); }
      .event { padding: 24px; }
      .event-info { max-width: 64%; }
    }
    @media (prefers-contrast: more) {
      body, .event { background: var(--deep); }
      .ambient { opacity: .35; }
      .event-name, .edition { color: var(--cream); }
    }
  </style>
