name: Publish society pages

on:
  push:
    branches: [main]
    paths:
      - brand/partnerships/index.html
      - join/**
      - brand/logos/logo-lockup-uop.svg
      - .github/workflows/partnerships-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Stage the public pages
        run: |
          install -Dm644 brand/partnerships/index.html _site/brand/partnerships/index.html
          install -Dm644 join/index.html _site/join/index.html
          install -Dm644 join/icon.svg _site/join/icon.svg
          install -Dm644 join/projector.js _site/join/projector.js
          install -Dm644 brand/logos/logo-lockup-uop.svg _site/brand/logos/logo-lockup-uop.svg
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
